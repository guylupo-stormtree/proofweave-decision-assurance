[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pwexp"
version = "0.1.0"
description = "ProofWeave Decision Gateway experiment: Green Verdict Ambiguity, evidence readiness and decision assurance"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6",
    "textual>=0.80",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
pwexp = "pwexp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
